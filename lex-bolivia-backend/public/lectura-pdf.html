<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lectura PDF - Yatilex</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lectura.css" />
  </head>
  <body>
    <header class="reader-header">
      <a href="index.html" class="back-link">Volver al buscador</a>
      <div class="brand">
        <img src="assets/logo.png" alt="Logo de Yatilex" class="brand-logo" />
        <h1>Yatilex</h1>
      </div>
    </header>

    <main class="reader-layout">
      <aside class="book-card">
        <img id="doc-cover" src="assets/portadas/constitucion.png" alt="Portada" class="cover" />
        <h2 id="doc-title">Documento legal</h2>
        <p id="query-info">Lectura general</p>
      </aside>

      <section class="pdf-panel">
        <h3 id="panel-title">Documento PDF</h3>
        <p id="search-highlight" class="search-highlight">Sin clausula destacada.</p>
        <div class="viewer-toolbar" aria-label="Controles del PDF">
          <button id="prev-page" class="viewer-btn" type="button">Anterior</button>
          <span id="page-info" class="page-info">Pagina 1 / 1</span>
          <button id="next-page" class="viewer-btn" type="button">Siguiente</button>
          <button id="zoom-out" class="viewer-btn" type="button">-</button>
          <span id="zoom-info" class="page-info">100%</span>
          <button id="zoom-in" class="viewer-btn" type="button">+</button>
          <button id="fit-width" class="viewer-btn" type="button">Ajustar ancho</button>
          <a id="open-native" class="viewer-link" target="_blank" rel="noopener">Abrir PDF</a>
        </div>

        <div id="pdf-viewer" class="pdf-viewer" role="region" aria-label="Visor de PDF">
          <canvas id="pdf-canvas"></canvas>
        </div>
        <p id="viewer-status" class="viewer-status" aria-live="polite">Cargando documento...</p>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="lectura-pdf.js" defer></script>
  </body>
</html>
