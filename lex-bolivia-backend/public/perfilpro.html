<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Profesional | Yatilex</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="perfilpro.css" />
  </head>
  <body>
    <header class="profile-topbar">
      <a href="index.html" class="back-link">Volver</a>
      <div class="profile-user">
        <img id="profile-avatar" src="assets/logo.png" alt="Avatar" class="profile-avatar" />
        <div>
          <p id="profile-role" class="profile-role">Profesional</p>
          <h1 id="profile-email">usuario@correo.com</h1>
        </div>
      </div>
      <button id="logout-btn" class="logout-btn" type="button">Cerrar sesion</button>
    </header>

    <main class="profile-layout">
      <aside class="profile-sidebar">
        <button class="menu-btn active" data-target="summary" type="button">Resumen</button>
        <button class="menu-btn" data-target="likes" type="button">Libros que me gustan</button>
        <button class="menu-btn" data-target="notes" type="button">Paginas de interes</button>
      </aside>

      <section class="profile-content">
        <article id="view-summary" class="panel-view">
          <h2>Resumen de actividad</h2>
          <div class="summary-grid">
            <div class="summary-card">
              <p>Libros favoritos</p>
              <strong id="summary-likes">0</strong>
            </div>
            <div class="summary-card">
              <p>Paginas guardadas</p>
              <strong id="summary-notes">0</strong>
            </div>
          </div>
        </article>

        <article id="view-likes" class="panel-view" hidden>
          <h2>Libros favoritos</h2>
          <div id="likes-list" class="list-grid"></div>
        </article>

        <article id="view-notes" class="panel-view" hidden>
          <h2>Paginas de interes</h2>
          <div id="notes-list" class="list-grid"></div>
        </article>

        <p id="profile-status" class="profile-status" aria-live="polite"></p>
      </section>
    </main>

    <script src="perfilpro.js" defer></script>
  </body>
</html>
