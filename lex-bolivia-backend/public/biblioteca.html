<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca | Yatilex</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="Logo de Yatilex" class="brand-logo" />
        <h1>Yatilex</h1>
      </div>

      <nav class="top-actions" aria-label="Accesos">
        <button id="back-home-btn" class="text-btn" type="button">Inicio</button>
      </nav>
    </header>

    <main class="library-main">
      <section class="library-head">
        <h2>Biblioteca Juridica</h2>
        <p>Selecciona un documento para abrirlo en el lector PDF.</p>
      </section>

      <section class="library-filter">
        <label for="library-search" class="sr-only">Filtrar documentos</label>
        <input
          id="library-search"
          type="text"
          placeholder="Filtrar por nombre del documento..."
          autocomplete="off"
        />
      </section>

      <section id="library-grid" class="library-grid" aria-label="Catalogo de documentos"></section>
      <p id="library-status" class="status" aria-live="polite"></p>
    </main>

    <script src="biblioteca.js" defer></script>
  </body>
</html>
