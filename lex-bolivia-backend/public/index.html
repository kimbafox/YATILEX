<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yatilex</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="Logo de Yatilex" class="brand-logo" />
        <h1>Yatilex</h1>
      </div>

      <nav class="top-actions" aria-label="Accesos">
        <button id="library-btn" class="text-btn" type="button">Biblioteca</button>
        <button class="icon-btn square-btn" type="button" aria-label="Notificaciones">
          <img src="assets/notificacion.png" alt="" class="notif-icon" aria-hidden="true" />
        </button>
        <button id="visitor-btn" class="visitor-box" type="button" aria-label="Conectar cuenta profesional">
          <div class="avatar" aria-hidden="true">
            <span class="head"></span>
            <span class="body"></span>
          </div>
          <span id="visitor-text" class="visitor-text">Visitante</span>
        </button>
      </nav>
    </header>

    <main class="hero">
      <section class="language-switch" aria-label="Idioma">
        <button class="lang-chip" type="button" data-lang="es" aria-pressed="true">Espanol</button>
        <button class="lang-chip" type="button" data-lang="qu" aria-pressed="false">Quechua</button>
        <button class="lang-chip" type="button" data-lang="ay" aria-pressed="false">Aymara</button>
      </section>

      <div class="search-zone">
        <form id="search-form" class="search-wrap" autocomplete="off">
        <label for="search-input" class="sr-only">Buscar</label>
        <img
          src="assets/icono_busqueda_2.png"
          alt=""
          class="search-input-icon"
          aria-hidden="true"
        />
        <input
          id="search-input"
          name="query"
          type="text"
          placeholder="Buscar en Yatilex..."
          required
        />
        <button
          id="mic-btn"
          class="icon-btn square-btn mic-btn"
          type="button"
          aria-label="Buscar por voz"
        >
          <img src="assets/microfono.png" alt="" class="mic-asset-icon" aria-hidden="true" />
        </button>
        <button class="search-btn" type="submit">
          <img src="assets/icono_busqueda_2.png" alt="" class="search-btn-icon" aria-hidden="true" />
          <span>Buscar</span>
        </button>
        </form>

        <section
          id="suggestions"
          class="suggestions"
          aria-label="Sugerencias de documentos"
          hidden
        ></section>
      </div>

      <div class="assistant-cta-wrap">
        <button
          id="assistant-btn"
          class="assistant-cta-btn"
          type="button"
          aria-label="Abrir asistente virtual"
          title="Asistente virtual"
        >
          <img src="assets/logo.png" alt="" class="assistant-cta-logo" aria-hidden="true" />
          <span class="sr-only">Asistente virtual</span>
        </button>
        <p class="assistant-cta-label">Asistente</p>
      </div>

      <p id="status" class="status" aria-live="polite">Listo para buscar.</p>
      <section id="results" class="results" aria-label="Resultados de busqueda"></section>

      <section id="site-assistant" class="site-assistant" hidden aria-label="Asistente del sitio">
        <div class="site-assistant-head">
          <div class="site-assistant-title-wrap">
            <img src="assets/logo.png" alt="" class="site-assistant-head-logo" aria-hidden="true" />
            <h3>Asistente Yatilex</h3>
          </div>
          <div class="site-assistant-actions">
            <button id="assistant-voice-toggle" class="assistant-mini-btn" type="button" aria-pressed="false">
              Voz off
            </button>
            <button id="assistant-close" class="assistant-close-btn" type="button" aria-label="Cerrar asistente">
              X
            </button>
          </div>
        </div>

        <div id="site-assistant-messages" class="site-assistant-messages" aria-live="polite"></div>

        <form id="site-assistant-form" class="site-assistant-form" autocomplete="off">
          <label for="site-assistant-input" class="sr-only">Escribe al asistente</label>
          <input
            id="site-assistant-input"
            type="text"
            placeholder="Pregunta como usar esta pagina..."
            maxlength="400"
            required
          />
          <button id="site-assistant-send" class="search-btn" type="submit">Enviar</button>
        </form>
      </section>

      <section class="recommended" aria-label="Documentos recomendados">
        <h2 id="recommended-title">Recomendado</h2>
        <div class="carousel" id="recommended-carousel">
          <button class="carousel-nav" id="carousel-prev" type="button" aria-label="Anterior">‹</button>
          <div class="carousel-track" id="carousel-track"></div>
          <button class="carousel-nav" id="carousel-next" type="button" aria-label="Siguiente">›</button>
        </div>
      </section>
    </main>

    <section id="auth-modal" class="auth-modal" hidden aria-label="Ingreso profesional">
      <div class="auth-modal-card">
        <button id="auth-close" class="assistant-close-btn" type="button" aria-label="Cerrar">X</button>
        <h3 id="auth-title">Conecta tu cuenta profesional</h3>
        <p id="auth-subtitle">Inicia sesion con Google para guardar tus libros favoritos y paginas de interes.</p>
        <div id="google-login-slot" class="google-login-slot"></div>
        <p id="auth-status" class="status" aria-live="polite"></p>
      </div>
    </section>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
