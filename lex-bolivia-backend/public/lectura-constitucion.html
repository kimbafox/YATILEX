<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lectura Constitucion - Yatilex</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lectura.css" />
  </head>
  <body>
    <header class="reader-header">
      <a id="back-link" href="index.html" class="back-link">Volver al buscador</a>
      <div class="brand">
        <img src="assets/logo.png" alt="Logo de Yatilex" class="brand-logo" />
        <h1>Yatilex</h1>
      </div>
    </header>

    <section class="language-switch reader-language-switch" aria-label="Idioma">
      <button class="lang-chip" type="button" data-lang="es" aria-pressed="true">Espanol</button>
      <button class="lang-chip" type="button" data-lang="qu" aria-pressed="false">Quechua</button>
      <button class="lang-chip" type="button" data-lang="ay" aria-pressed="false">Aymara</button>
    </section>

    <main class="reader-layout">
      <aside class="book-card">
        <img
          src="assets/portadas/constitucion.png"
          alt="Portada Constitucion de Bolivia"
          class="cover"
        />
        <h2 id="doc-title">Constitucion de Bolivia</h2>
        <p id="query-info">Lectura general</p>
      </aside>

      <section class="pdf-panel">
        <h3 id="panel-title">Documento PDF</h3>
        <iframe id="pdf-frame" title="Constitucion de Bolivia en PDF"></iframe>
      </section>
    </main>

    <script src="lectura.js" defer></script>
  </body>
</html>
